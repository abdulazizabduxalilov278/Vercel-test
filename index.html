<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodda Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --container-bg: #fff;
            --input-bg: #fff;
            --input-border: #ccc;
            --primary: #0070f3;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --container-bg: #16213e;
            --input-bg: #1f2a4c;
            --input-border: #444;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 320px;
            position: relative;
        }

        .switch-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
        }

        #xabarlarList {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .xabar-item {
            background-color: var(--input-bg);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            font-size: 14px;
        }

        .xabar-author {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 3px;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            opacity: 0;
            transition: 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <button id="themeBtn" class="btn" style="background-color: #555;">🌙</button>
        <div>
            <select id="langSelect" style="padding: 8px; border-radius: 6px;">
                <option value="uz">UZ</option>
                <option value="ru">RU</option>
                <option value="en">EN</option>
            </select>
            <button id="authBtn" class="btn">Kirish</button>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align: center; color: var(--primary);" id="chatTitle">Xabarlar</h2>
        <input type="text" id="xabarInput" placeholder="Xabar yozing...">
        <button id="yuborishBtn" class="btn" style="width: 100%; margin-top: 10px;">Jo'natish</button>
        <div id="xabarlarList"></div>
    </div>

    <!-- Modal (Login/Register) -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <span id="closeModal" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px;">&times;</span>
            
            <!-- Kirish -->
            <div id="loginBox">
                <h3 style="text-align: center;" id="lTitle">Kirish</h3>
                <input type="text" id="loginNick" placeholder="Nick Name (Taxallus)...">
                <input type="password" id="loginPass" placeholder="Parol...">
                <button id="loginSubmit" class="btn" style="width: 100%; margin-top: 10px;">Kirish</button>
                <span class="switch-link" id="toReg">Akkaunt yo'qmi? Ro'yxatdan o'tish</span>
            </div>

            <!-- Ro'yxatdan o'tish -->
            <div id="regBox" style="display: none;">
                <h3 style="text-align: center;" id="rTitle">Ro'yxatdan o'tish</h3>
                <input type="text" id="regNick" placeholder="Nick Name o'ylab toping...">
                <input type="password" id="regPass" placeholder="Parol (kamida 6 ta belgi)...">
                <button id="regSubmit" class="btn" style="width: 100%; margin-top: 10px;">Ro'yxatdan o'tish</button>
                <span class="switch-link" id="toLog">Akkaunt bormi? Kirish</span>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const dict = {
            uz: { login: "Kirish", logout: "Chiqish", title: "Xabarlar", ph: "Xabar yozing...", send: "Jo'natish", noAcc: "Akkaunt yo'qmi? Ro'yxatdan o'tish", hasAcc: "Akkaunt bormi? Kirish", err: "Xatolik!", ok: "Muvaffaqiyatli!", authErr: "Xabar yozish uchun avval kiring!", shortPass: "Parol kamida 6 ta belgi bo'lishi shart!" },
            ru: { login: "Войти", logout: "Выйти", title: "Сообщения", ph: "Введите сообщение...", send: "Отправить", noAcc: "Нет аккаунта? Регистрация", hasAcc: "Есть аккаунт? Войти", err: "Ошибка!", ok: "Успешно!", authErr: "Сначала войдите!", shortPass: "Пароль должен быть минимум 6 символов!" },
            en: { login: "Login", logout: "Logout", title: "Messages", ph: "Type a message...", send: "Send", noAcc: "No account? Register", hasAcc: "Have account? Login", err: "Error!", ok: "Success!", authErr: "Please login first!", shortPass: "Password must be at least 6 characters!" }
        };

        let lang = 'uz';

        function applyLang(l) {
            lang = l;
            document.getElementById('chatTitle').textContent = dict[l].title;
            document.getElementById('xabarInput').placeholder = dict[l].ph;
            document.getElementById('yuborishBtn').textContent = dict[l].send;
            document.getElementById('toReg').textContent = dict[l].noAcc;
            document.getElementById('toLog').textContent = dict[l].hasAcc;
            updateBtn();
        }

        document.getElementById('langSelect').addEventListener('change', (e) => applyLang(e.target.value));

        function showToast(txt, bg = '#28a745') {
            const t = document.getElementById('toast');
            t.textContent = txt;
            t.style.backgroundColor = bg;
            t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        document.getElementById('themeBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        const modal = document.getElementById('authModal');
        const loginBox = document.getElementById('loginBox');
        const regBox = document.getElementById('regBox');

        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
        document.getElementById('toReg').onclick = () => { loginBox.style.display = 'none'; regBox.style.display = 'block'; };
        document.getElementById('toLog').onclick = () => { regBox.style.display = 'none'; loginBox.style.display = 'block'; };

        const supabaseUrl = 'https://dfetxagpkertqafomckx.supabase.co';
        const supabaseKey = 'sb_publishable_lbnKuSiSvQIbON2Akddy8Q_cY_85JgU';
        const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;
        let currentUser = null;

        supabaseClient.auth.onAuthStateChange((evt, session) => {
            currentUser = session ? session.user : null;
            updateBtn();
            if(currentUser) modal.classList.remove('active');
        });

        function updateBtn() {
            const btn = document.getElementById('authBtn');
            if (currentUser) {
                btn.textContent = dict[lang].logout;
                btn.onclick = async () => { await supabaseClient.auth.signOut(); showToast(dict[lang].ok); };
            } else {
                btn.textContent = dict[lang].login;
                btn.onclick = () => { loginBox.style.display = 'block'; regBox.style.display = 'none'; modal.classList.add('active'); };
            }
        }

        async function loadMsgs() {
            const { data } = await supabaseClient.from('xabarlar').select('*').order('id', { ascending: false });
            const list = document.getElementById('xabarlarList');
            list.innerHTML = '';
            if (data) {
                data.forEach(m => {
                    const d = document.createElement('div');
                    d.className = 'xabar-item';
                    
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'xabar-author';
                    authorDiv.textContent = m.author ? "@" + m.author : "@Noma'lum";

                    const textDiv = document.createElement('div');
                    textDiv.textContent = m.matn;

                    d.appendChild(authorDiv);
                    d.appendChild(textDiv);
                    list.appendChild(d);
                });
            }
        }
        loadMsgs();

        document.getElementById('yuborishBtn').onclick = async () => {
            if(!currentUser) {
                showToast(dict[lang].authErr, "#dc3545");
                loginBox.style.display = 'none'; regBox.style.display = 'block'; modal.classList.add('active');
                return;
            }
            const inp = document.getElementById('xabarInput');
            if(!inp.value.trim()) return;

            // Nickname ni email dan ajratib olamiz
            const currentNick = currentUser.email.split('@')[0];

            const { error } = await supabaseClient.from('xabarlar').insert([{ 
                matn: inp.value.trim(), 
                author: currentNick 
            }]);

            if(!error) { inp.value = ''; loadMsgs(); showToast(dict[lang].ok); }
            else showToast(error.message, "#dc3545");
        };

        document.getElementById('regSubmit').onclick = async () => {
            const nick = document.getElementById('regNick').value.trim();
            const pass = document.getElementById('regPass').value.trim();

            if(!nick) return showToast(dict[lang].err, "#ffc107");
            if(pass.length < 6) return showToast(dict[lang].shortPass, "#dc3545");

            const fakeEmail = nick.toLowerCase() + "@site.com";
            const { error } = await supabaseClient.auth.signUp({ email: fakeEmail, password: pass });

            if(error) showToast("Xato: " + error.message, "#dc3545");
            else showToast(dict[lang].ok);
        };

        document.getElementById('loginSubmit').onclick = async () => {
            const nick = document.getElementById('loginNick').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if(!nick || !pass) return showToast(dict[lang].err, "#ffc107");

            const fakeEmail = nick.toLowerCase() + "@site.com";
            const { error } = await supabaseClient.auth.signInWithPassword({ email: fakeEmail, password: pass });

            if(error) showToast("Nick Name yoki parol xato!", "#dc3545");
            else showToast(dict[lang].ok);
        };

        applyLang('uz');
    </script>
</body>
</html>
