<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodda Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --container-bg: #fff;
            --input-bg: #fff;
            --input-border: #ccc;
            --primary: #0070f3;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --container-bg: #16213e;
            --input-bg: #1f2a4c;
            --input-border: #444;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:disabled {
            background-color: #777;
            cursor: not-allowed;
        }

        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 320px;
            position: relative;
        }

        #xabarlarList {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .xabar-item {
            background-color: var(--input-bg);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            font-size: 14px;
        }

        .xabar-author {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 3px;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            opacity: 0;
            transition: 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <button id="themeBtn" class="btn" style="background-color: #555;">🌙</button>
        <div>
            <select id="langSelect" style="padding: 8px; border-radius: 6px;">
                <option value="uz">UZ</option>
                <option value="ru">RU</option>
                <option value="en">EN</option>
            </select>
            <button id="authBtn" class="btn">Kirish</button>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align: center; color: var(--primary);" id="chatTitle">Xabarlar</h2>
        <input type="text" id="xabarInput" placeholder="Xabar yozing...">
        <button id="yuborishBtn" class="btn" style="width: 100%; margin-top: 10px;">Jo'natish</button>
        <div id="xabarlarList"></div>
    </div>

    <!-- Facebook uslubidagi yagona Kirish oynasi -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <span id="closeModal" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 20px;">&times;</span>
            <h3 style="text-align: center; margin-top: 0;" id="lTitle">Tizimga kirish</h3>
            
            <input type="text" id="loginNick" placeholder="Nick Name...">
            <input type="password" id="loginPass" placeholder="Parol (kamida 6 ta belgi)...">
            <button id="loginSubmit" class="btn" style="width: 100%; margin-top: 15px;">Kirish</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const dict = {
            uz: { login: "Kirish", logout: "Chiqish", title: "Xabarlar", ph: "Xabar yozing...", send: "Jo'natish", err: "Maydonlarni to'ldiring!", ok: "Muvaffaqiyatli!", authErr: "Xabar yozish uchun avval kiring!", shortPass: "Parol kamida 6 ta belgi bo'lishi shart!" },
            ru: { login: "Войти", logout: "Выйти", title: "Сообщения", ph: "Введите сообщение...", send: "Отправить", err: "Заполните поля!", ok: "Успешно!", authErr: "Сначала войдите!", shortPass: "Пароль должен быть минимум 6 символов!" },
            en: { login: "Login", logout: "Logout", title: "Messages", ph: "Type a message...", send: "Send", err: "Fill in fields!", ok: "Success!", authErr: "Please login first!", shortPass: "Password must be at least 6 characters!" }
        };

        let lang = 'uz';

        function applyLang(l) {
            lang = l;
            document.getElementById('chatTitle').textContent = dict[l].title;
            document.getElementById('xabarInput').placeholder = dict[l].ph;
            document.getElementById('yuborishBtn').textContent = dict[l].send;
            updateBtn();
        }

        document.getElementById('langSelect').addEventListener('change', (e) => applyLang(e.target.value));

        function showToast(txt, bg = '#28a745') {
            const t = document.getElementById('toast');
            t.textContent = txt;
            t.style.backgroundColor = bg;
            t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        document.getElementById('themeBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        const modal = document.getElementById('authModal');
        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');

        const supabaseUrl = 'https://dfetxagpkertqafomckx.supabase.co';
        const supabaseKey = 'sb_publishable_lbnKuSiSvQIbON2Akddy8Q_cY_85JgU';
        const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;
        let currentUser = null;

        // Xavfsizlik (Brute-force) uchun o'zgaruvchilar
        let failedAttempts = 0;
        let lockTime = 0; // soniyalarda

        supabaseClient.auth.onAuthStateChange((evt, session) => {
            currentUser = session ? session.user : null;
            updateBtn();
            if(currentUser) {
                modal.classList.remove('active');
                failedAttempts = 0; // Muvaffaqiyatli kirganda xatolar sanog'i tozalanadi
            }
        });

        function updateBtn() {
            const btn = document.getElementById('authBtn');
            if (currentUser) {
                btn.textContent = dict[lang].logout;
                btn.onclick = async () => { await supabaseClient.auth.signOut(); showToast(dict[lang].ok); };
            } else {
                btn.textContent = dict[lang].login;
                btn.onclick = () => { modal.classList.add('active'); };
            }
        }

        async function loadMsgs() {
            const { data } = await supabaseClient.from('xabarlar').select('*').order('id', { ascending: false });
            const list = document.getElementById('xabarlarList');
            list.innerHTML = '';
            if (data) {
                data.forEach(m => {
                    const d = document.createElement('div');
                    d.className = 'xabar-item';
                    
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'xabar-author';
                    authorDiv.textContent = m.author ? "@" + m.author : "@Noma'lum";

                    const textDiv = document.createElement('div');
                    textDiv.textContent = m.matn;

                    d.appendChild(authorDiv);
                    d.appendChild(textDiv);
                    list.appendChild(d);
                });
            }
        }
        loadMsgs();

        document.getElementById('yuborishBtn').onclick = async () => {
            if(!currentUser) {
                showToast(dict[lang].authErr, "#dc3545");
                modal.classList.add('active');
                return;
            }
            const inp = document.getElementById('xabarInput');
            if(!inp.value.trim()) return;

            const currentNick = currentUser.email.split('@')[0];

            const { error } = await supabaseClient.from('xabarlar').insert([{ 
                matn: inp.value.trim(), 
                author: currentNick 
            }]);

            if(!error) { inp.value = ''; loadMsgs(); showToast(dict[lang].ok); }
            else showToast(error.message, "#dc3545");
        };

        // Eksponentsial blokirovka mexanizmi bilan Kirish
        document.getElementById('loginSubmit').onclick = async () => {
            const submitBtn = document.getElementById('loginSubmit');

            // Agar vaqtinchalik blokirovka tugamagan bo'lsa
            if (lockTime > 0) {
                showToast(`Juda ko'p xato urinish! ${lockTime} sekund kuting.`, "#dc3545");
                return;
            }

            const nick = document.getElementById('loginNick').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if(!nick || !pass) return showToast(dict[lang].err, "#ffc107");
            if(pass.length < 6) return showToast(dict[lang].shortPass, "#dc3545");

            const fakeEmail = nick.toLowerCase() + "@site.com";

            let { error } = await supabaseClient.auth.signInWithPassword({
                email: fakeEmail,
                password: pass
            });

            if (error) {
                let signUpRes = await supabaseClient.auth.signUp({
                    email: fakeEmail,
                    password: pass
                });
                
                if (signUpRes.error) {
                    failedAttempts++; // Xato urinishlar sonini oshiramiz
                    
                    // Har 3 ta xatoda blokirovka vaqtini 2 baravar oshiramiz (60s -> 120s -> 240s...)
                    if (failedAttempts % 3 === 0) {
                        lockTime = (failedAttempts === 3) ? 60 : lockTime * 2;
                        submitBtn.disabled = true;

                        let timer = setInterval(() => {
                            lockTime--;
                            submitBtn.textContent = `Bloklandi (${lockTime}s)`;
                            if (lockTime <= 0) {
                                clearInterval(timer);
                                submitBtn.disabled = false;
                                submitBtn.textContent = "Kirish";
                            }
                        }, 1000);

                        showToast(`Juda ko'p xato! ${lockTime} sekundga bloklandi.`, "#dc3545");
                    } else {
                        showToast("Parol yoki Nick Name xato!", "#dc3545");
                    }
                } else {
                    showToast(dict[lang].ok);
                }
            } else {
                showToast(dict[lang].ok);
            }
        };

        applyLang('uz');
    </script>
</body>
</html>
